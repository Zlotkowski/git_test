<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prosty sklep internetowy z elektroniką" />
    <title>Mój Prosty Sklep</title>

    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header class="header">
        <h1 class="logo">Mój Prosty Sklep</h1>

        <section class="cart-summary" aria-label="Podsumowanie koszyka">
            <p>🛒 Koszyk: <span id="cart-count">0</span></p>
            <p>💰 Suma: <span id="cart-total">0</span> zł</p>
        </section>
    </header>

    <main>
        <section class="promo" aria-label="Promocja tygodnia">
            🎉 Promocja tygodnia: wszystkie myszki -10%!
        </section>

        <section
            id="products"
            class="products"
            aria-label="Lista produktów"
        ></section>

        <section class="slider-container" aria-label="Galeria promocyjna">
            <div id="slider" class="slider"></div>
        </section>

        <section class="cart-preview" aria-labelledby="cart-title">
            <h2 id="cart-title">🛒 Zawartość koszyka</h2>
            <ul id="cart-items"></ul>
            <button id="clear-cart-btn" type="button">
                Wyczyść koszyk
            </button>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Mój Prosty Sklep - Stopka testowa v2</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
